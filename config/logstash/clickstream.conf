input {
  file {
    path => "/usr/share/logstash/clickstream_data/weblog.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  # Удаляем возможную BOM-метку UTF-8
  mutate {
    gsub => ["message", "^\xEF\xBB\xBF", ""]
  }

  # Разбираем CSV: IP, время, URL, статус
  csv {
    separator => ","
    columns => ["client_ip", "timestamp_raw", "request", "code_raw"]
  }

  # Убираем квадратную скобку в начале времени
  mutate {
    gsub => ["timestamp_raw", "^\[", ""]
  }

  # Парсим время из лога в поле log_time (НЕ в @timestamp)
  date {
    match => ["timestamp_raw", "dd/MMM/yyyy:HH:mm:ss"]
    target => "log_time"
    timezone => "UTC"
  }

  # Переименовываем code_raw в code и преобразуем в целое число
  mutate {
    rename => { "code_raw" => "code" }
    convert => { "code" => "integer" }
    remove_field => ["timestamp_raw", "message"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "clickstream-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
